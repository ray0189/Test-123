[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raygold"
version = "0.1.0"
description = "XAUUSD pattern-recognition research framework and MT5 scanner (read-only by default)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "numba>=0.59",
    "scipy>=1.11",
    "pyarrow>=14",
    "pyyaml>=6",
    "rich>=13",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45; platform_system == 'Windows'"]
dev = ["pytest>=8"]

[project.scripts]
raygold = "raygold.cli:main"

[tool.setuptools.packages.find]
include = ["raygold*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: longer integration tests"]
